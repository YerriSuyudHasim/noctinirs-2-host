[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noctinirs-host"
version = "0.0.1"
description = "PC host application core for the NoctiNIRS 2 fNIRS device (non-clinical research prototype)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Desktop UI (ADR-0001). Exact pins. NumPy 2.5.4 needs Python >= 3.12, so the UI
# group effectively requires Python 3.12+; the core keeps ">=3.11".
ui = [
  "PySide6-Essentials==6.12.0",
  "pyqtgraph==0.14.0",
  "numpy==2.5.4",
]
# Build tool only; not part of the shipped application.
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

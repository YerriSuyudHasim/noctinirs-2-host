name: build-ui-windows

# Builds the standalone desktop UI on Windows and uploads it as a workflow artifact.
# Runs on demand, and on pull requests that touch the UI or packaging files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/noctinirs_host_ui/**"
      - "packaging/**"
      - ".github/workflows/build-ui-windows.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - name: Install (UI + build tools, exact pins from pyproject.toml)
        run: python -m pip install -e ".[dev,ui,build]"
      - name: Tests (core + UI, headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rs
      - name: Build PyInstaller onedir bundle and report
        run: python packaging/build.py
      - name: Smoke test the built application
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\NoctiNIRS-Host\NoctiNIRS-Host.exe" -ArgumentList @("--self-test", $out) -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $out -Pattern "SELFTEST OK" -Quiet)) { exit 1 }
      - name: Publish the build report in the job summary
        shell: pwsh
        run: Get-Content "dist\build-report.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: NoctiNIRS-Host-windows-s0
          path: |
            dist/NoctiNIRS-Host-win32.zip
            dist/build-report.md
            dist/bundle-manifest.txt
          retention-days: 14
